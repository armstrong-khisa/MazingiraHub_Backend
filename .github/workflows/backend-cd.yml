name: Backend CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Backend Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv

      - name: Install dependencies
        run: |
          pipenv sync --dev

      - name: Verify application
        run: |
          pipenv run python -m compileall .

      - name: Deployment ready
        run: |
          echo "Backend passed deployment checks and is ready for deployment."