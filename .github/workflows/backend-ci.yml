name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Flask Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv

      - name: Install dependencies
        run: |
          pipenv sync --dev

      - name: Run tests
        run: |
          pipenv run pytest -q

      - name: Run application smoke test
        run: |
          pipenv run python -c "from app import app; response = app.test_client().get('/'); assert response.status_code == 200; print(response.get_json())"

      - name: Verify Python modules
        run: |
          pipenv run python -m compileall .

      - name: CI passed
        run: |
          echo "Flask backend passed CI checks."